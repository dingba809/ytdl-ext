<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 380px; margin: 0; padding: 12px 14px 14px;
        font: 12.5px/1.45 system-ui, "Segoe UI", sans-serif;
        background: #18181c; color: #ececef;
      }
      .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      .brand { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b6b74; flex: none; }
      .dot.ok { background: #34c759; }
      .dot.bad { background: #ff453a; }
      .svc-sub { font-size: 11px; color: #8e8e98; font-weight: 400; }
      .ghost {
        background: #26262c; color: #cfd0d6; border: 1px solid #32323a;
        border-radius: 6px; padding: 4px 8px; font-size: 11.5px; cursor: pointer;
      }
      .ghost:hover { background: #303038; color: #fff; }
      .ghost:disabled { opacity: .45; cursor: default; }

      .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: #222228; padding: 3px; border-radius: 8px; margin-bottom: 12px; }
      .tab {
        border: 0; background: transparent; color: #9a9aa4; padding: 6px 4px;
        border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;
      }
      .tab.active { background: #32323c; color: #fff; }
      .panel { display: none; }
      .panel.active { display: block; }

      .card { background: #222228; border: 1px solid #2d2d35; border-radius: 8px; padding: 9px 10px; margin-bottom: 10px; }
      .label { display: block; font-size: 11px; color: #8e8e98; margin-bottom: 5px; }
      .title-text { font-weight: 500; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: #2f2f38; color: #a9abb6; margin-right: 5px; }
      .tag.hi { background: rgba(47,111,237,.22); color: #7aa7ff; }

      select, input[type="text"], input[type="number"] {
        width: 100%; background: #18181c; color: #ececef; border: 1px solid #34343e;
        border-radius: 6px; padding: 7px 8px; font: inherit; outline: none;
      }
      select:focus, input:focus { border-color: #2f6fed; }
      .hint { font-size: 11px; color: #8e8e98; margin-top: 4px; }

      .checks { display: flex; flex-wrap: wrap; gap: 10px 14px; margin: 10px 0; }
      .checks label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: #d6d6dc; user-select: none; }
      .checks input { accent-color: #2f6fed; margin: 0; }

      .clip-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-bottom: 10px; }
      .clip-row span { color: #6e6e78; }

      .primary {
        width: 100%; padding: 9px; border: 0; border-radius: 8px;
        background: #2f6fed; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .primary:hover:not(:disabled) { background: #3b7bff; }
      .primary:disabled { background: #2e2e36; color: #6d6d76; cursor: default; }

      .msg { margin-top: 8px; font-size: 11.5px; color: #9a9aa4; min-height: 16px; word-break: break-word; }
      .msg.err { color: #ff5a52; }
      .msg.ok { color: #34c759; }

      .jobs-list { max-height: 310px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .job { background: #222228; border: 1px solid #2d2d35; border-radius: 8px; padding: 8px 10px; }
      .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
      .job-title { font-weight: 500; font-size: 12px; word-break: break-word; flex: 1; }
      .job-meta { font-size: 11px; color: #8e8e98; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .bar { height: 4px; background: #32323a; border-radius: 2px; margin-top: 6px; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: #2f6fed; transition: width .25s; }
      .bar i.done { background: #34c759; }
      .bar i.err { background: #ff453a; }
      .job-actions { display: flex; gap: 6px; margin-top: 7px; }
      .job-err { color: #ff5a52; font-size: 11px; margin-top: 4px; word-break: break-word; }
      .empty { text-align: center; color: #757580; padding: 28px 0; }
      .jobs-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

      .field { margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="brand">
        <span class="dot" id="dot"></span>
        <div>
          <div>YouTube 下载器</div>
          <div class="svc-sub" id="svc">检查本地服务…</div>
        </div>
      </div>
      <button class="ghost" id="openDir" disabled>打开目录</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="dl">下载</button>
      <button class="tab" data-tab="jobs">任务 <span id="jobCount"></span></button>
      <button class="tab" data-tab="cfg">设置</button>
    </div>

    <section class="panel active" id="panel-dl">
      <div class="card">
        <span class="label">当前页面</span>
        <div id="pageInfo" class="title-text">检测中…</div>
      </div>

      <div class="field">
        <span class="label">画质与格式</span>
        <select id="preset"></select>
        <div class="hint" id="presetDesc"></div>
      </div>

      <div class="checks">
        <label><input type="checkbox" id="useCookies" />携带登录态 (Cookie)</label>
        <label><input type="checkbox" id="subtitles" />下载字幕 (.srt)</label>
        <label id="playlistWrap" style="display:none"><input type="checkbox" id="playlist" />下载整个播放列表</label>
      </div>

      <span class="label">片段截取（可选，留空下载完整视频）</span>
      <div class="clip-row">
        <input type="text" id="startTime" placeholder="起始 如 00:30" />
        <span>—</span>
        <input type="text" id="endTime" placeholder="结束 如 02:15" />
      </div>

      <button class="primary" id="go" disabled>开始下载</button>
      <div class="msg" id="dlMsg"></div>
    </section>

    <section class="panel" id="panel-jobs">
      <div class="jobs-list" id="jobsList"><div class="empty">暂无下载任务</div></div>
      <div class="jobs-foot">
        <span class="svc-sub" id="jobsSummary"></span>
        <button class="ghost" id="clearJobs">清空已完成</button>
      </div>
    </section>

    <section class="panel" id="panel-cfg">
      <div class="field">
        <span class="label">保存目录</span>
        <input type="text" id="cfgOutDir" placeholder="C:\Users\...\Downloads\ytdl" />
      </div>
      <div class="field">
        <span class="label">代理地址（留空直连）</span>
        <input type="text" id="cfgProxy" placeholder="http://127.0.0.1:7890" />
      </div>
      <div class="field">
        <span class="label">最大同时下载数 (1~4)</span>
        <input type="number" id="cfgConcurrent" min="1" max="4" value="2" />
      </div>
      <button class="primary" id="saveCfg">保存设置</button>
      <div class="msg" id="cfgMsg"></div>
    </section>

    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
